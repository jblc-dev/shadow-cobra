[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cobra"
version = "0.0.1"
description = "Discover new music"
readme = "README.md"
requires-python = ">=3"
dependencies = [
   "networkx",
   "yt-dlp"
]

[project.scripts]
cobra = "cobra.cli:main"
cobra-gui = "cobra.web.server:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
